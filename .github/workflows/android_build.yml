name: Android Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APKs & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generation (Drift / Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Keystore & Signing Config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/behravan-release.jks

            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=behravan-release.jks"
            } > android/key.properties

            echo "Release keystore configured successfully."
          else
            echo "WARNING: KEYSTORE_BASE64 is empty. Using debug signing fallback."
          fi

      - name: Run Analyzer & Tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split-ABI APKs
        run: flutter build apk --split-per-abi --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: download-apks

      - name: Download AAB Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: download-aab

      - name: Prepare Versioned Release Assets
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"

          # Stage all APKs (both universal and split-ABI) with tag suffix
          if [ -d "download-apks" ]; then
            for file in download-apks/*.apk; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                base="${filename%.*}"
                cp "$file" "release-artifacts/${base}-${TAG}.apk"
              fi
            done
          fi

          # Stage AAB with tag suffix
          if [ -d "download-aab" ]; then
            for file in download-aab/*.aab; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                base="${filename%.*}"
                cp "$file" "release-artifacts/${base}-${TAG}.aab"
              fi
            done
          fi

          echo "Staged release artifacts:"
          ls -lh release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
